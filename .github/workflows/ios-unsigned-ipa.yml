name: iOS Unsigned Device IPA

# Builds a real iPhone device .app with signing DISABLED, manually packages it
# into an unsigned .ipa, and uploads it as an artifact for later Sideloadly/AltStore
# signing on Windows. This does NOT sign, does NOT install, and does NOT verify
# runtime playback or device behavior. Manual trigger only.
#
# This is separate from the iOS Build Check (simulator compile gate) workflow,
# which remains unchanged.

on:
  workflow_dispatch:
  # Temporary: lets this workflow run from the feature branch before it is on
  # the default branch (workflow_dispatch only shows on the default branch).
  # Remove once merged to the default branch.
  push:
    branches:
      - feature/ios-companion-app
      - feature/video-player-ui-polish

jobs:
  unsigned-ipa:
    name: Build unsigned device IPA
    runs-on: macos-15

    defaults:
      run:
        working-directory: ios

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen if missing
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install CocoaPods dependencies
        run: pod install

      - name: Archive (device, no signing)
        run: |
          xcodebuild archive \
            -workspace PersonalCloudDownloader.xcworkspace \
            -scheme PersonalCloudDownloader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PersonalCloudDownloader.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/PersonalCloudDownloader.xcarchive/Products/Applications/PersonalCloudDownloader.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Device .app not found at $APP_PATH"
            exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r PersonalCloudDownloader-unsigned.ipa Payload

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersonalCloudDownloader-unsigned
          path: ios/PersonalCloudDownloader-unsigned.ipa
          if-no-files-found: error
