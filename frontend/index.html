<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personal Cloud Downloader</title>
    <link rel="stylesheet" href="style.css?v=phase6-20260728">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand-mark" aria-hidden="true">PC</div>
        <div class="brand-copy">
          <p class="eyebrow">Tailscale private cloud</p>
          <h1>Personal downloader</h1>
        </div>
        <button id="refreshButton" class="ghost-button" type="button" aria-label="Refresh downloads">Refresh</button>
      </header>

      <div class="dashboard-grid">
        <section class="command-panel dl-composer" aria-labelledby="addTitle">
          <div class="section-heading">
            <h2 id="addTitle">Start a download</h2>
          </div>
          <label class="magnet-field">
            <span class="visually-hidden">Magnet link</span>
            <textarea id="magnetLink" rows="2" placeholder="magnet:?xt=urn:btih:..." aria-describedby="magnetKeyboardHint"></textarea>
          </label>
          <button id="addMagnetButton" class="primary-button" type="button">Start download</button>
          <small id="magnetKeyboardHint" class="keyboard-hint">Ctrl+Enter also starts the download</small>
          <p id="status" class="status-line" role="status" aria-live="polite">Connecting to private backend...</p>
        </section>

        <section class="content-section queue-panel" aria-labelledby="torrentsTitle">
          <div class="section-heading row-heading">
            <div>
              <p class="panel-kicker">Queue</p>
              <h2 id="torrentsTitle">Downloads</h2>
              <div id="queueSummary" class="dl-summary"></div>
            </div>
            <span id="lastUpdated" class="last-updated"></span>
          </div>
          <div id="torrentList" class="stack"></div>
        </section>

        <section class="content-section files-panel" aria-labelledby="completedTitle">
          <div class="section-heading">
            <p class="panel-kicker">Library</p>
            <h2 id="completedTitle">Completed files</h2>
            <p>Tap for browser playback, local save, or a VLC-ready link.</p>
          </div>
          <div id="completedFiles" class="stack"></div>
        </section>
      </div>
    </main>

    <script src="app.js?v=direct-downloads-20260816"></script>
  </body>
</html>
