name: PersonalCloudDownloader

options:
  bundleIdPrefix: com.personalcloud
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  PersonalCloudDownloader:
    type: application
    platform: iOS
    sources:
      - path: PersonalCloudDownloader
    info:
      path: PersonalCloudDownloader/Info.plist
      properties:
        CFBundleDisplayName: CloudBox
        UILaunchScreen: {}
        # Portrait + landscape must be declared so the fullscreen player can
        # rotate; the AppDelegate mask keeps every non-player screen portrait.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Private services are reached over HTTP through Tailscale only.
        # Allow arbitrary loads so WKWebView can load those private HTTP URLs.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.personalcloud.PersonalCloudDownloader
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
